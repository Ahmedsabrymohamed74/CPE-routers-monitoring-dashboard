apiVersion: v1
kind: Secret
metadata:
  name: router-dashboard-secret
  namespace: backend
type: Opaque
stringData:
  # Dashboard login credentials (separate from router credentials).
  # Generate DASHBOARD_SECRET_KEY with: openssl rand -hex 32
  DASHBOARD_SECRET_KEY: replace-with-random-session-signing-key
  DASHBOARD_ADMIN_USERNAME: admin
  DASHBOARD_ADMIN_PASSWORD: replace-with-strong-password
  HUAWEI_ROUTER_USERNAME: admin
  HUAWEI_ROUTER_PASSWORD: replace-me
  ZTE_ROUTER_USERNAME: admin
  ZTE_ROUTER_PASSWORD: replace-me
  ZTE_SESSION_COOKIE: ""
  DB_USER: router_user
  DB_PASSWORD: replace-me
