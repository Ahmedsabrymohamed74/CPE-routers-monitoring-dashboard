apiVersion: v1
kind: ConfigMap
metadata:
  name: router-dashboard-config
  namespace: backend
data:
  # App runtime
  APP_HOST: "0.0.0.0"
  APP_PORT: "5000"

  # Dashboard display
  DASHBOARD_NETWORK_TYPE: "LTE / 4G"
  DASHBOARD_OPERATOR_NAME: "Vodafone Egypt"

  # Router connection
  ROUTER_URL: "http://192.168.9.1"

  # Historical cellular metrics
  HISTORICAL_ENABLED: "true"
  HISTORICAL_POLL_INTERVAL_SECONDS: "60"
  HISTORICAL_RETENTION_DAYS: "7"

  # Database
  DB_HOST: "timescaledb"
  DB_PORT: "5432"
  DB_NAME: "router_metrics"
