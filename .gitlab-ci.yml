stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/router-dashboard"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

python-check:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r resources/requirements.txt
    - python -m py_compile resources/app.py resources/db.py resources/router_client.py

kubernetes-manifest-check:
  stage: test
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s_mani > /tmp/router-dashboard.yaml
    - kubectl apply --dry-run=client --validate=false -f /tmp/router-dashboard.yaml

container-build:
  stage: build
  image:
    name: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - buildah bud -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" resources
    - buildah push "$IMAGE_NAME:$IMAGE_TAG"
    - buildah push "$IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_BRANCH

deploy-lab:
  stage: deploy
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  variables:
    IMAGE: "$IMAGE_NAME:$IMAGE_TAG"
  before_script:
    - apk add --no-cache curl
    - curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
    - chmod +x /usr/local/bin/sops
    - mkdir -p ~/.config/sops/age
    - if [ -n "$SOPS_AGE_KEY" ]; then printf "%s\n" "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt; fi
  script:
    - if [ -f secrets/router-dashboard-secret.sops.yaml ]; then sops --decrypt secrets/router-dashboard-secret.sops.yaml | kubectl apply -f -; fi
    - kubectl apply -k k8s_mani
    - kubectl -n backend set image deployment/router-dashboard router-dashboard="$IMAGE"
    - kubectl -n backend rollout status deployment/router-dashboard --timeout=180s
  environment:
    name: lab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
